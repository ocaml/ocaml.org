name: Release scraper

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tool/**'
      - 'src/**'
      - 'dune-project'
      - '*.opam'
      - '.github/workflows/release-scraper.yml'

jobs:
  release:
    name: release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Use OCaml 5.5.2
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.5.2"
          dune-cache: true
          opam-repositories: |
            pin: git+https://github.com/ocaml/opam-repository#ca403de684b07caee6f246b36a2f3a1787d780ac
          opam-disable-sandboxing: true

      - name: Install opam dependencies
        run: opam install --deps-only --with-test .

      # scrape.exe for the data scrapers; doc_modules.exe for
      # scrape-doc-modules.yml.
      - name: Build scrapers
        run: opam exec -- dune build tool/data-scrape/bin/scrape.exe tool/doc-modules/bin/doc_modules.exe

      - name: Delete previous release
        run: gh release delete scraper-latest --cleanup-tag --yes || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release
        run: |
          gh release create scraper-latest \
            _build/default/tool/data-scrape/bin/scrape.exe \
            _build/default/tool/doc-modules/bin/doc_modules.exe \
            --title "Scraper @ ${GITHUB_SHA::7}" \
            --notes "Built from ${{ github.sha }}" \
            --latest=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
