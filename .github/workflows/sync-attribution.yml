name: Sync attribution

# Keep data/attribution.jsonl (the per-document "Authors and history" records,
# see tool/attribution) up to date with main, after the fact.
#
# Pull requests never touch the store: on every push to main that changes a
# tutorial or tool page, this job runs `data-attribution sync` on main itself
# and proposes the result as a single rolling pull request, like the scrape
# workflows do. That's why records cannot conflict between pull requests, and
# why the watermark each record carries (`generated_at_commit`) is always a
# commit of main: a squash merge can't discard it, and no restamp is needed.
#
# Each run starts again from main and recomputes every record, so a stale or
# superseded bot pull request is simply overwritten, and a missed run is caught
# up by the next one.
#
# Shallow by design (#3902: the repository's full history never enters CI): we
# fetch main's tip, then deepen back to each record's watermark only. After a
# sync every record shares one watermark, so the depth is the lag since the
# last merged sync.

on:
  push:
    branches: [ main ]
    paths:
      - 'data/tutorials/**/*.md'
      - 'data/tool_pages/**/*.md'
      # A maintainer re-seed (or a merged sync) changes the store alone: run
      # again so an open sync pull request is regenerated or closed.
      - 'data/attribution.jsonl'
  workflow_dispatch:

# Every run recomputes the whole store from main, so a newer run supersedes an
# older one.
concurrency:
  group: sync-attribution
  cancel-in-progress: true

env:
  BRANCH: bot/attribution

jobs:
  sync:
    name: sync
    if: github.repository == 'ocaml/ocaml.org'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Deepen to every record's watermark
        run: |
          set -eu
          for wm in $(jq -r .generated_at_commit data/attribution.jsonl | sort -u); do
            # Deepen main's history until it reaches the watermark, so
            # `<watermark>..HEAD` covers every commit since. (Fetch filters like
            # --shallow-exclude take a ref, not a commit, hence the loop.)
            until git merge-base --is-ancestor "$wm" HEAD 2>/dev/null; do
              msg="::error::watermark $wm is not an ancestor of main; run 'make attribution-seed' on main and open a PR"
              if [ "$(git rev-parse --is-shallow-repository)" = false ]; then
                echo "$msg"; exit 1
              fi
              git fetch --no-tags --deepen=100 origin "${GITHUB_SHA}" \
                || { echo "$msg"; exit 1; }
            done
          done

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.2.0"
          dune-cache: true
          opam-repositories: |
            pin: git+https://github.com/ocaml/opam-repository#8cdfa3296d9bc7d93273f46eb2438757e4fd5cf0
          opam-disable-sandboxing: true

      - name: Install the tool's dependencies
        # Keep in sync with tool/attribution/lib/dune's (libraries …).
        run: opam install --yes bos cmdliner yojson yaml fmt fpath

      - name: Sync
        run: opam exec -- dune exec tool/attribution/bin/main.exe -- sync

      # A sync always re-stamps every record at HEAD. Only propose it when some
      # record's content changed, otherwise every merged sync would trigger a
      # stamp-only pull request of its own. The pages whose record changed name
      # the pull request: "attribution: 3 pages (roadmap, principles, …)".
      - name: Which records' content changed?
        id: diff
        run: |
          norm () { jq -c 'del(.generated_at_commit, .generator)' | sort; }
          comm -3 <(git show HEAD:data/attribution.jsonl | norm) \
                  <(norm < data/attribution.jsonl) \
            | sed 's/^\t//' | jq -r .path | sort -u > "$RUNNER_TEMP/paths"
          n=$(wc -l < "$RUNNER_TEMP/paths")
          if [ "$n" -eq 0 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            git checkout -- data/attribution.jsonl
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          pages=$([ "$n" -eq 1 ] && echo "1 page" || echo "$n pages")
          # Page names without directory, extension and ordering prefix, as
          # many as fit in a 72-byte subject.
          title=$(sed 's|.*/||; s|\.md$||; s|^[0-9a-z]*_[0-9]*_||' "$RUNNER_TEMP/paths" \
            | awk -v head="attribution: $pages (" '
                { names[NR] = $0 }
                END {
                  s = head names[1]
                  for (i = 2; i <= NR; i++) {
                    t = s ", " names[i]
                    if (length(t ((i < NR) ? ", …)" : ")")) > 72) { s = s ", …"; break }
                    s = t
                  }
                  print s ")"
                }')
          echo "title=$title" >> "$GITHUB_OUTPUT"
          { echo "msg<<EOF"; echo "$title"; echo; sed 's/^/- /' "$RUNNER_TEMP/paths"; echo "EOF"; } >> "$GITHUB_OUTPUT"

      - name: Create or update the sync pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          title: ${{ steps.diff.outputs.title }}
          labels: attribution
          branch: ${{ env.BRANCH }}
          add-paths: |
            data/attribution.jsonl
          commit-message: ${{ steps.diff.outputs.msg }}
          body: |
            Automated by `.github/workflows/sync-attribution.yml`: the records in `data/attribution.jsonl`, folded forward to ${{ github.sha }} with `data-attribution sync`.

            Generated from main, so it never conflicts with other pull requests. Each new push to main that touches a tutorial or tool page regenerates this pull request. Merge it whenever convenient.

      - name: Close a superseded sync pull request
        if: steps.diff.outputs.changed == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh pr view "$BRANCH" --json state --jq .state 2>/dev/null | grep -qx OPEN; then
            gh pr close "$BRANCH" --delete-branch \
              --comment "Superseded: the records on main are already up to date."
          fi
