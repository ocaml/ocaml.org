name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Prime the caches every Monday
    - cron: 0 1 * * MON
  workflow_dispatch:

jobs:
  build:
    name: Build and test

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
        ocaml-compiler:
          - "5.5.2"

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Use OCaml ${{ matrix.ocaml-compiler }}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
          dune-cache: ${{ matrix.os != 'macos-latest' }}
          opam-repositories: |
            pin: git+https://github.com/ocaml/opam-repository#ca403de684b07caee6f246b36a2f3a1787d780ac
          opam-disable-sandboxing: true

      - name: Install opam dependencies
        run: opam install --deps-only --with-test .

      - name: Install ocamlformat
        run: opam install ocamlformat.0.29.0

      - name: Build project
        run: make

      - name: Run tests
        run: make test

      # Needs curl, jq and python3, which Ubuntu runners have; GNU date and
      # touch, hence Linux only. Requests go to a local mock backend only.
      - name: Test the doc-modules scraper
        run: tool/doc-modules/test/scrape_test.sh _build/default/tool/doc-modules/compile.exe
        if: runner.os == 'Linux'

      - name: Format code
        run: make fmt
        if: runner.os == 'Linux'
