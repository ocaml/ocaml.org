name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Prime the caches every Monday
    - cron: 0 1 * * MON
  workflow_dispatch:

jobs:
  build:
    name: Build and test

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
        ocaml-compiler:
          - "5.5.2"

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Use OCaml ${{ matrix.ocaml-compiler }}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
          dune-cache: ${{ matrix.os != 'macos-latest' }}
          opam-repositories: |
            pin: git+https://github.com/ocaml/opam-repository#ca403de684b07caee6f246b36a2f3a1787d780ac
          opam-disable-sandboxing: true

      - name: Install opam dependencies
        run: opam install --deps-only --with-test .

      - name: Install ocamlformat
        run: opam install ocamlformat.0.29.0

      - name: Build project
        run: make

      - name: Run tests
        run: make test

      # The doc-modules scraper itself is tested by `make test`; its release
      # asset helper, a shell script, here. Needs jq, which Ubuntu runners have.
      - name: Test the doc-modules release asset helper
        run: tool/doc-modules/test/release_assets_test.sh
        if: runner.os == 'Linux'

      - name: Format code
        run: make fmt
        if: runner.os == 'Linux'
