name: Devcontainer image

# Builds .devcontainer/Dockerfile and publishes it as
# ghcr.io/ocaml/ocaml.org-dev:<tag>, where <tag> is computed by
# .devcontainer/tag.sh from the files that determine the image's contents. An
# image that already exists under its tag is not rebuilt. Before publishing,
# OCaml.org is built and tested inside the image. Pushes to main also
# move the :main tag. Pull requests from branches of this repository publish
# their own <tag>, so that cloud sessions on a branch that changes dependencies
# get a matching image; pull requests from forks, and Dependabot's, are built
# and tested but not published. Pull requests build the branch head, not the
# merge commit, so that <tag> matches what tag.sh computes on the branch.

on:
  push:
    branches: [main]
    paths:
      - '.devcontainer/**'
      - 'ocamlorg.opam'
      - '.github/workflows/devcontainer.yml'
  pull_request:
    branches: [main]
    paths:
      - '.devcontainer/**'
      - 'ocamlorg.opam'
      - '.github/workflows/devcontainer.yml'
  workflow_dispatch:

concurrency:
  group: devcontainer-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/ocaml/ocaml.org-dev

jobs:
  image:
    name: Build and publish
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # On pull requests, the branch head rather than the merge commit.
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Compute the image tag and the publishing policy
        id: plan
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          echo "tag=$(.devcontainer/tag.sh)" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" != pull_request ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "main=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = pull_request ] \
            && [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ] \
            && [ "$PR_AUTHOR" != 'dependabot[bot]' ]; then
            # Dependabot's runs get a read-only token; its digest updates are
            # published by the push to main once merged.
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "main=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "main=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to the GitHub Container Registry
        if: steps.plan.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether the image already exists
        id: exists
        if: steps.plan.outputs.publish == 'true'
        run: |
          if docker manifest inspect "$IMAGE:${{ steps.plan.outputs.tag }}" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.exists.outputs.found != 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build the image
        if: steps.exists.outputs.found != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .devcontainer/Dockerfile
          load: true
          tags: ${{ env.IMAGE }}:${{ steps.plan.outputs.tag }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:main
          provenance: false

      # Build and test OCaml.org inside the image the way cloud sessions do
      # (.devcontainer/run: root, checkout mounted at the same path), so that an
      # image that can't build the project is never published.
      - name: Build and test OCaml.org in the image
        if: steps.exists.outputs.found != 'true'
        run: |
          docker run --rm -u root -e OPAMROOT=/home/opam/.opam \
            -v "$PWD:$PWD" -w "$PWD" "$IMAGE:${{ steps.plan.outputs.tag }}" \
            sh -c 'make build && make test'

      # Same build again, served from the builder's cache, pushed by BuildKit
      # itself: `docker push` of the loaded image would re-compress the layers,
      # and the inline cache metadata would no longer match the pushed blobs.
      # That metadata lets later builds, and devcontainer.json's cacheFrom,
      # reuse the published layers.
      # No provenance attestation: registries list it as an extra
      # `unknown/unknown` platform beside linux/amd64, and nothing consumes it.
      - name: Push the image
        if: steps.exists.outputs.found != 'true' && steps.plan.outputs.publish == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .devcontainer/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.plan.outputs.tag }}
            ${{ steps.plan.outputs.main == 'true' && format('{0}:main', env.IMAGE) || '' }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:main
          cache-to: type=inline
          provenance: false

      - name: Point :main at an image that already exists
        if: steps.exists.outputs.found == 'true' && steps.plan.outputs.main == 'true'
        run: docker buildx imagetools create -t "$IMAGE:main" "$IMAGE:${{ steps.plan.outputs.tag }}"
