name: Scrape doc modules

# The module paths of every package's documentation, from the per-package
# sidebar.json of the documentation backend, published as assets of the
# release `doc-modules-latest` (#3982):
# - doc-modules.jsonl.gz: the reference form, one JSON object per package;
# - doc-modules-v1.idx: the same data compiled into the memory-mappable index
#   that the ocaml.org servers download and map (only uploaded when it
#   changed, so its ETag stays put otherwise);
# - stats.jsonl: one record per scrape, used to decide how often to scrape.
#
# The documentation backend regenerates docs in batches, much less often than
# opam-repository changes. The workflow wakes up hourly, and policy.sh decides
# from stats.jsonl whether a scrape is due (between every hour and every day).
# A scrape keeps the load limits agreed with the backend's admins: one
# kept-alive connection, at most 8 requests per second, ETag revalidation
# (~3.6k requests, ~8 min, a few KB when nothing changed). The scrape state is
# kept in an Actions cache, saved only after a successful run; a manual run
# with `reset` starts from an empty state (~5.3k requests, ~9 MB, ~15 min).

on:
  workflow_dispatch:
    inputs:
      reset:
        description: Start from an empty scrape state (refetch everything)
        type: boolean
        default: false
  schedule:
    - cron: 17 * * * *

# One scrape at a time: overlapping runs would double the load on the backend
# and race on the release assets.
concurrency:
  group: scrape-doc-modules
  cancel-in-progress: false

env:
  RELEASE_TAG: doc-modules-latest
  # Bump when the layout of the scrape state changes, so that a new version of
  # the script never starts from a state it does not understand.
  STATE_KEY: doc-modules-state-v1

jobs:
  scrape:
    name: scrape
    if: github.event_name != 'schedule' || github.repository == 'ocaml/ocaml.org'
    runs-on: ubuntu-latest
    # A full refetch takes ~15 min. The scrape itself is limited to 40 min
    # (see the Scrape step), so that its stats are still published. A run cut
    # short saves no state (it is only saved after a successful compile).
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      # The release is production data: a manual run from another branch would
      # publish it with that branch's scripts. (Scheduled runs are always on
      # the default branch, and their event carries no repository.)
      - name: Only on the default branch
        if: >-
          github.event_name == 'workflow_dispatch' &&
          github.ref_name != github.event.repository.default_branch
        env:
          REF: ${{ github.ref_name }}
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          echo "Run this workflow from $DEFAULT, not $REF: it publishes to the release $RELEASE_TAG." >&2
          exit 1

      - name: Checkout code
        uses: actions/checkout@v7

      # Only a missing release (the very first run) or a missing index is
      # tolerated: any other failure fails the job, including a release without
      # stats.jsonl, since scraping without the published stats would scrape
      # too early and overwrite their history. An interrupted replacement of an
      # asset is recovered (see release-assets.sh).
      - name: Download the published stats and index
        run: |
          mkdir -p _out
          tool/doc-modules/release-assets.sh download "$RELEASE_TAG" _published \
            stats.jsonl doc-modules-v1.idx

      - name: Is a scrape due?
        id: policy
        run: >-
          FORCE=${{ github.event_name == 'workflow_dispatch' && 1 || 0 }}
          tool/doc-modules/policy.sh _published/stats.jsonl "$GITHUB_STEP_SUMMARY"
          >> "$GITHUB_OUTPUT"

      - name: Clone opam-repository
        if: steps.policy.outputs.due == 'true'
        run: git clone --depth 1 https://github.com/ocaml/opam-repository.git _opam-repository

      - name: Restore scrape state
        if: steps.policy.outputs.due == 'true' && !inputs.reset
        uses: actions/cache/restore@v4
        with:
          path: _doc-modules-state
          key: ${{ env.STATE_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ env.STATE_KEY }}-

      # Every attempt records its stats, so that policy.sh counts it: an
      # aborted scrape writes its own record; a scrape killed by the time limit
      # below or crashing gets a minimal one. The limit leaves the rest of the
      # job time to publish the stats. The job fails at the end.
      - name: Scrape
        id: scrape
        if: steps.policy.outputs.due == 'true'
        run: |
          started=$(date -u +%s)
          if SCRAPE_STATS=_out/run-stats.jsonl timeout 40m \
               tool/doc-modules/scrape.sh \
               _opam-repository _doc-modules-state _out/doc-modules.jsonl; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            cat _doc-modules-state/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            status=$?
            echo "ok=false" >> "$GITHUB_OUTPUT"
            if [ ! -s _out/run-stats.jsonl ]; then
              jq -n -c --argjson started "$started" --argjson status "$status" '
                { started: $started, finished: (now | floor),
                  status: "aborted",
                  reason: "scrape.sh exited with \($status) without a record"
                    + (if $status == 124 then " (time limit)" else "" end) }' \
                > _out/run-stats.jsonl
            fi
          fi

      # Also after a failed step (but not after a skipped policy step, nor a
      # cancelled run): the stats of an attempt must be published whatever
      # happens after it, or every hourly wake-up would be due. Records older
      # than STATS_KEEP_DAYS are dropped: policy.sh only needs recent batches.
      # The first run creates the release with the stats in one command (gh
      # publishes it only once its assets are uploaded), so that a release
      # never exists without them.
      - name: Publish the stats
        if: ${{ !cancelled() && steps.policy.outputs.due == 'true' }}
        env:
          STATS_KEEP_DAYS: 180
        run: |
          if [ -s _out/run-stats.jsonl ]; then
            cat _published/stats.jsonl _out/run-stats.jsonl |
              jq -c --argjson cutoff "$(( $(date -u +%s) - STATS_KEEP_DAYS * 86400 ))" \
                'select(.started >= $cutoff)' > _out/stats.jsonl
            if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
              tool/doc-modules/release-assets.sh replace "$RELEASE_TAG" _out/stats.jsonl
            else
              gh release create "$RELEASE_TAG" --prerelease --latest=false \
                --title "Doc modules" \
                --notes "Module paths of package documentation, see #3982. Updated by .github/workflows/scrape-doc-modules.yml." \
                _out/stats.jsonl
            fi
          fi

      - name: Set up OCaml
        if: steps.scrape.outputs.ok == 'true'
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.5.2"
          dune-cache: true
          opam-repositories: |
            pin: git+https://github.com/ocaml/opam-repository#ca403de684b07caee6f246b36a2f3a1787d780ac

      - name: Compile the index
        id: compile
        if: steps.scrape.outputs.ok == 'true'
        run: |
          opam install -y dune yojson
          opam exec -- dune build ./tool/doc-modules/compile.exe
          ./_build/default/tool/doc-modules/compile.exe \
            _out/doc-modules.jsonl _out/doc-modules-v1.idx
          gzip -9 -n -k _out/doc-modules.jsonl

      # Also when unchanged, if a previous replacement of the index or the
      # JSONL was interrupted, to finish it.
      - name: Publish the index
        if: steps.compile.outcome == 'success'
        run: |
          if cmp -s _out/doc-modules-v1.idx _published/doc-modules-v1.idx &&
             ! grep -q '^doc-modules' _published/unfinished; then
            echo "Index unchanged: not uploaded." >> "$GITHUB_STEP_SUMMARY"
          else
            tool/doc-modules/release-assets.sh replace "$RELEASE_TAG" \
              _out/doc-modules-v1.idx _out/doc-modules.jsonl.gz
            echo "Index changed: uploaded." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Only once the index is published: otherwise the next run must produce
      # it again, so it starts from the state the published index came from.
      - name: Save scrape state
        if: steps.compile.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: _doc-modules-state
          key: ${{ env.STATE_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Fail if the scrape aborted
        if: steps.scrape.outputs.ok == 'false'
        run: exit 1
