version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # Digest of the devcontainer's base image. Each update rebuilds the published
  # image from scratch, hence the monthly schedule.
  - package-ecosystem: docker
    directory: /.devcontainer
    schedule:
      interval: monthly
    ignore:
      # The OCaml version follows the production Dockerfile, and older tags
      # stop being rebuilt (their bundled opam-repository falls behind the pin):
      # only the digest moves.
      - dependency-name: ocaml/opam
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
