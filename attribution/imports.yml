# Documents imported from the earlier site (v2.ocaml.org), whose pre-2023 git
# authorship this repository lost on import. The generator (tool/attribution)
# mines the mapped path's history in a local clone of that repo and folds those
# contributors in. `derived_from` records provenance older than even that repo's
# history — the sources it was itself copied/ported from (see attribution/
# sources.yml), which git blame cannot reach.
#
# `repo` is a path to the clone, relative to this repository's root. Seeding and
# `check` of these documents require that clone to be present; the results are
# baked into data/attribution.jsonl, which is the committed source of truth.

repo: ../v2.ocaml.org

